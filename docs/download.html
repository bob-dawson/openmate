<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0e0e">
<title>OpenMate · 下载</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e0e;
    --fg: #e9e9e9;
    --muted: #9a9a9a;
    --card: #1a1a1a;
    --line: #2a2a2a;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px 40px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { width: 100%; max-width: 420px; }
  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #7aa2f7, #bb9af7);
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: .3px; }
  .sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 26px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .version {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 13px; color: var(--muted); margin-bottom: 12px;
  }
  .version b { color: var(--fg); font-size: 15px; font-weight: 600; }
  .btn {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent); color: #0b1020; font-weight: 650;
    padding: 15px 16px; border-radius: 11px; font-size: 16px;
  }
  .btn:active { opacity: .85; }
  .btn[aria-disabled="true"] { background: var(--line); color: var(--muted); pointer-events: none; }
  .alt { display: block; text-align: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .alt a { color: var(--accent); text-decoration: none; }
  .notes { margin: 20px 2px 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
  .notes li { margin: 6px 0; padding-left: 16px; position: relative; }
  .notes li::before { content: "·"; position: absolute; left: 4px; color: var(--accent); }
  .notes a { color: var(--accent); text-decoration: none; }
  footer { margin-top: 22px; text-align: center; font-size: 12px; color: #6b6b6b; }
  .spinner { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="logo"></div>
    <h1>OpenMate</h1>
  </div>
  <p class="sub" id="sub">opencode 的 Android 客户端</p>

  <div class="card">
    <div class="version">
      <span id="version-label">版本</span>
      <b id="version-value"><span class="spinner">◌</span></b>
    </div>
    <a class="btn" id="primary" href="#" aria-disabled="true">下载 APK</a>
    <div class="alt" id="alt-wrap"></div>
  </div>

  <ul class="notes">
    <li id="note-bridge"></li>
    <li id="note-android"></li>
  </ul>
  <footer>OpenMate · Apache-2.0</footer>
</main>

<script>
(function () {
  var VERSION_URL = '/version.json';
  var REPO = 'https://github.com/bob-dawson/openmate';
  var ATOMGIT = 'https://atomgit.com/article88/openmate';
  var zh = /^zh/i.test(navigator.language || '') || /^zh/i.test(navigator.languages ? navigator.languages.join(',') : '');

  var T = zh ? {
    sub: 'opencode 的 Android 客户端',
    versionLabel: '最新版本',
    download: function (v) { return '下载 APK · v' + v; },
    alt: function (name, url) { return '下载慢？换 <a href="' + url + '">' + name + '</a> 源试试'; },
    unknown: '未知',
    bridge: '需要先在电脑上运行 <a href="' + REPO + '#get-started-in-5-minutes">OpenMate Bridge</a>，并要求电脑已安装 opencode v2',
    android: '支持 Android 8.0（API 26）及以上',
    failed: '获取版本信息失败，可前往 <a href="' + ATOMGIT + '/releases">AtomGit</a> 或 <a href="' + REPO + '/releases/latest">GitHub</a> 手动下载'
  } : {
    sub: 'The Android client for opencode',
    versionLabel: 'Latest version',
    download: function (v) { return 'Download APK · v' + v; },
    alt: function (name, url) { return 'Slow? Try the <a href="' + url + '">' + name + '</a> mirror'; },
    unknown: 'unknown',
    bridge: 'Requires <a href="' + REPO + '#get-started-in-5-minutes">OpenMate Bridge</a> running on a computer with opencode v2 installed',
    android: 'Runs on Android 8.0 (API 26) and above',
    failed: 'Could not load the version info — download manually from <a href="' + ATOMGIT + '/releases">AtomGit</a> or <a href="' + REPO + '/releases/latest">GitHub</a>'
  };

  var $ = function (id) { return document.getElementById(id); };
  $('sub').textContent = T.sub;
  $('version-label').textContent = T.versionLabel;
  $('note-bridge').innerHTML = T.bridge;
  $('note-android').textContent = T.android;
  document.documentElement.lang = zh ? 'zh' : 'en';

  function apkName(version) { return 'OpenMate-' + version + '.apk'; }

  function mirrorNames(list) {
    return list.map(function (base) {
      return /atomgit/i.test(base) ? 'AtomGit' : 'GitHub';
    });
  }

  fetch(VERSION_URL, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var android = (data && data.android) || {};
      var version = android.version;
      var tag = android.tag;
      if (!version || !tag) { throw new Error('missing version'); }

      var mirrors = android.mirrors || {};
      var preferred = (mirrors.cn && mirrors.cn.length) ? mirrors.cn : (mirrors.default || []);
      var other = (mirrors.cn && mirrors.cn.length) ? (mirrors.default || []) : (mirrors.cn || []);
      // In mainland China AtomGit is much faster; elsewhere GitHub usually is.
      if (!zh && preferred.length && /atomgit/i.test(preferred[0]) && other.length) {
        var swap = preferred; preferred = other; other = swap;
      }
      var file = apkName(version);
      var primaryUrl = preferred[0] ? preferred[0] + '/' + tag + '/' + file : null;
      var altUrl = other[0] ? other[0] + '/' + tag + '/' + file : null;

      $('version-value').textContent = 'v' + version;
      $('version-value').className = '';

      if (primaryUrl) {
        var btn = $('primary');
        btn.href = primaryUrl;
        btn.textContent = T.download(version);
        btn.removeAttribute('aria-disabled');
      }

      if (altUrl) {
        var names = mirrorNames(other);
        $('alt-wrap').innerHTML = T.alt(names[0], altUrl);
      }
    })
    .catch(function () {
      $('version-value').textContent = T.unknown;
      $('version-value').className = '';
      $('alt-wrap').innerHTML = T.failed;
    });
})();
</script>
</body>
</html>
