name: Mirror to AtomGit

# Mirrors all branches and tags from GitHub to AtomGit.
# Requires repository secrets ATOMGIT_USER and ATOMGIT_TOKEN.
# If they are not set yet, the job skips (green) instead of failing.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: mirror-atomgit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'bob-dawson/openmate'
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          if [ -z "${ATOMGIT_TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ATOMGIT_TOKEN is not set; skipping AtomGit mirror."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push branches and tags to AtomGit
        if: steps.cfg.outputs.configured == 'true'
        env:
          ATOMGIT_HOST: atomgit.com
          ATOMGIT_USER: ${{ secrets.ATOMGIT_USER }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_REPO: ${{ vars.ATOMGIT_REPO || 'openmate' }}
          ATOMGIT_BASE_URL: ${{ secrets.ATOMGIT_BASE_URL }}
        run: |
          set -uo pipefail
          if [ -z "${ATOMGIT_USER}" ]; then
            echo "ATOMGIT_USER is not set; skipping."; exit 0
          fi

          plain="${ATOMGIT_BASE_URL:-https://${ATOMGIT_HOST}/${ATOMGIT_USER}/${ATOMGIT_REPO}.git}"
          hostpath="${plain#https://}"
          echo "Target repo: ${hostpath}"
          redact() { local s="$1"; s="${s//$ATOMGIT_TOKEN/***}"; s="${s//$plain/<repo>}"; echo "$s"; }

          echo "== API probe (token validity, HTTP status only) =="
          for ep in \
            "https://${ATOMGIT_HOST}/api/v1/user" \
            "https://${ATOMGIT_HOST}/api/v4/user" \
            "https://${ATOMGIT_HOST}/api/v5/user" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${ATOMGIT_TOKEN}" "$ep" 2>/dev/null || echo "err")
            echo "  ${ep} -> HTTP ${code}"
          done

          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*" >/dev/null 2>&1

          echo "== auth format probe (git push --dry-run) =="
          candidates=(
            "user:token|https://${ATOMGIT_USER}:${ATOMGIT_TOKEN}@${hostpath}"
            "oauth2:token|https://oauth2:${ATOMGIT_TOKEN}@${hostpath}"
            "x-access-token:token|https://x-access-token:${ATOMGIT_TOKEN}@${hostpath}"
            "token@|https://${ATOMGIT_TOKEN}@${hostpath}"
            "token:token|https://${ATOMGIT_TOKEN}:${ATOMGIT_TOKEN}@${hostpath}"
          )

          working=""
          for entry in "${candidates[@]}"; do
            name="${entry%%|*}"; url="${entry#*|}"
            if out=$(GIT_TERMINAL_PROMPT=0 git push --dry-run --force "$url" "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*" 2>&1); then
              echo "  OK   auth=${name}"; working="$url"; break
            else
              echo "  FAIL auth=${name}: $(redact "$(echo "$out" | grep -m1 -Ei 'denied|fatal|error|not found|forbidden|401|403|404' || echo "$out" | head -n1)")"
            fi
          done

          if [ -z "$working" ]; then
            echo "::error::No working AtomGit auth format. Verify: repo exists, ATOMGIT_USER is your login handle, PAT created on atomgit.com with code read/write, not expired."
            exit 1
          fi

          echo "Pushing to AtomGit using auth=${working%%|*}"
          git push --prune --force "$working" "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
