name: Mirror to AtomGit

# Mirrors all branches and tags from GitHub to AtomGit.
# Requires repository secrets ATOMGIT_USER and ATOMGIT_TOKEN.
# If they are not set yet, the job skips (green) instead of failing.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: mirror-atomgit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'bob-dawson/openmate'
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          if [ -z "${ATOMGIT_TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ATOMGIT_TOKEN is not set; skipping AtomGit mirror."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push branches and tags to AtomGit
        if: steps.cfg.outputs.configured == 'true'
        env:
          ATOMGIT_HOST: atomgit.com
          ATOMGIT_USER: ${{ secrets.ATOMGIT_USER }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_REPO: ${{ vars.ATOMGIT_REPO || 'openmate' }}
          ATOMGIT_BASE_URL: ${{ secrets.ATOMGIT_BASE_URL }}
        run: |
          set -uo pipefail
          TOKEN="${ATOMGIT_TOKEN}"
          redact() { local s="$1"; s="${s//$TOKEN/***}"; s="${s//$ATOMGIT_USER/***}"; echo "$s"; }

          echo "== token check via API (PRIVATE-TOKEN) =="
          info=$(curl -s -H "PRIVATE-TOKEN: ${TOKEN}" "https://${ATOMGIT_HOST}/api/v5/user" 2>/dev/null || true)
          token_user=$(echo "$info" | grep -oE '"username"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 | sed -E 's/.*:[[:space:]]*"([^"]*)"/\1/')
          if [ -n "$token_user" ]; then
            echo "  token valid; owner=${token_user}"
          else
            echo "  token lookup failed; response head: $(redact "$(echo "$info" | head -c 300)")"
          fi
          echo "  ATOMGIT_USER(secret)=${ATOMGIT_USER}"

          # Prefer the username the token actually belongs to (fixes a mis-typed ATOMGIT_USER)
          owner="${token_user:-$ATOMGIT_USER}"
          if [ -z "$owner" ]; then echo "::error::no username available"; exit 1; fi

          plain="${ATOMGIT_BASE_URL:-https://${ATOMGIT_HOST}/${owner}/${ATOMGIT_REPO}.git}"
          hostpath="${plain#https://}"
          echo "Target repo: ${hostpath}"

          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*" >/dev/null 2>&1

          echo "== auth format probe (git push --dry-run) =="
          candidates=(
            "user:token|https://${owner}:${TOKEN}@${hostpath}"
            "oauth2:token|https://oauth2:${TOKEN}@${hostpath}"
            "user:token-encoded|https://${owner}:${TOKEN}@${hostpath}"
            "token:token|https://${TOKEN}:${TOKEN}@${hostpath}"
          )

          working=""
          for entry in "${candidates[@]}"; do
            name="${entry%%|*}"; url="${entry#*|}"
            if out=$(GIT_TERMINAL_PROMPT=0 git push --dry-run --force "$url" "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*" 2>&1); then
              echo "  OK   auth=${name}"; working="$url"; break
            else
              echo "  FAIL auth=${name}: $(redact "$(echo "$out" | grep -m1 -Ei 'denied|fatal|error|not found|forbidden|401|403|404' || echo "$out" | head -n1)")"
            fi
          done

          if [ -z "$working" ]; then
            echo "::error::No working AtomGit auth format. Verify the PAT (scopes read_repository+write_repository) and that the repo exists."
            exit 1
          fi

          echo "Pushing to AtomGit (repo=${hostpath})"
          git push --prune --force "$working" "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
