name: Mirror release to AtomGit

# Automatic mirroring also runs at the end of release.yml. Releases created by
# the repository GITHUB_TOKEN do not fire the `release` event, so that hook only
# covers releases created manually; keep this workflow for manual back-fills.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror (e.g. v0.3.4)"
        required: true

concurrency:
  group: mirror-release-atomgit-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror-release:
    if: github.repository == 'bob-dawson/openmate'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mirror release to AtomGit
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMGIT_USER: ${{ secrets.ATOMGIT_USER }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_REPO: ${{ vars.ATOMGIT_REPO || 'openmate' }}
          ATOMGIT_HOST: atomgit.com
        run: bash .github/scripts/mirror-release-atomgit.sh
